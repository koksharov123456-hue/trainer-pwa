```html
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#800000">
  <meta name="description" content="Тренажер тестов">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <title>Тренажер тестов</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3f4f6;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #install {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;

      display: none;

      padding: 12px 18px;
      border: 0;
      border-radius: 12px;

      background: #800000;
      color: white;

      font: 700 15px/1.2 system-ui, sans-serif;

      box-shadow: 0 8px 24px rgba(0,0,0,.22);
      cursor: pointer;
    }

    #install:hover {
      background: #a00000;
    }

    #installPage {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .installBox {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
      box-sizing: border-box;
    }

    .installIcon {
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      border-radius: 22px;
    }

    .installBox h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .installBox p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
    }

    #installPageButton {
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;
      background: #800000;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #installPageButton:hover {
      background: #a00000;
    }

    #installStatus {
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <!-- Обычная страница теста -->
  <iframe
    id="testFrame"
    src="https://script.google.com/macros/s/AKfycbweG0jamDG8Sc1KPuHJrZQr-xSJzoBAMt__-chg6GE0SDl6EJHz6DhRbh9ckCJpRG_eTA/exec"
    title="Тренажер тестов"
    allow="fullscreen">
  </iframe>

  <!-- Кнопка установки на обычной странице PWA -->
  <button id="install">
    Установить приложение
  </button>

  <!-- Специальная страница установки -->
  <div id="installPage">

    <div class="installBox">

      <img
        class="installIcon"
        src="icons/icon-192.png"
        alt="Тренажер тестов"
      >

      <h1>Тренажер тестов</h1>

      <p id="installDescription">
        Установите приложение, чтобы открывать тест
        прямо с рабочего стола.
      </p>

      <button id="installPageButton">
        Установить приложение
      </button>

      <div id="installStatus"></div>

    </div>

  </div>

  <script>
    let deferredPrompt = null;

    const installButton =
      document.getElementById('install');

    const installPage =
      document.getElementById('installPage');

    const testFrame =
      document.getElementById('testFrame');

    const installPageButton =
      document.getElementById('installPageButton');

    const installStatus =
      document.getElementById('installStatus');

    // Определяем, открыт ли PWA как установленное приложение
    function isStandalone() {
      return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );
    }

    // Проверяем, установлено ли приложение
    function isAlreadyInstalled() {
      return (
        isStandalone() ||
        localStorage.getItem('trainerPwaInstalled') === 'yes'
      );
    }

    // Проверяем, открыт ли режим установки
    const installMode =
      new URLSearchParams(window.location.search)
        .get('install') === '1';

    // Если открыли ?install=1 —
    // показываем специальную страницу установки
    if (installMode) {
      testFrame.style.display = 'none';
      installButton.style.display = 'none';
      installPage.style.display = 'flex';
    }

    // Браузер сообщает, что приложение можно установить
    window.addEventListener('beforeinstallprompt', (event) => {

      event.preventDefault();

      deferredPrompt = event;

      if (isAlreadyInstalled()) {

        if (installMode) {
          installPageButton.style.display = 'none';
          installStatus.textContent =
            'Приложение уже установлено.';
        }

        installButton.style.display = 'none';

        return;
      }

      // В режиме установки показываем кнопку
      if (installMode) {
        installPageButton.style.display = 'block';
        installStatus.textContent = '';
      } else {
        installButton.style.display = 'block';
      }
    });

    // Кнопка установки на странице ?install=1
    installPageButton.addEventListener('click', async () => {

      if (isAlreadyInstalled()) {

        installPageButton.style.display = 'none';

        installStatus.textContent =
          'Приложение уже установлено.';

        return;
      }

      if (!deferredPrompt) {

        installStatus.textContent =
          'Установка сейчас недоступна. ' +
          'Откройте меню браузера и выберите «Установить приложение».';

        return;
      }

      try {

        deferredPrompt.prompt();

        const result =
          await deferredPrompt.userChoice;

        if (result.outcome === 'accepted') {

          localStorage.setItem(
            'trainerPwaInstalled',
            'yes'
          );

          installPageButton.style.display = 'none';

          installStatus.textContent =
            'Приложение устанавливается…';

        } else {

          installStatus.textContent =
            'Установка отменена.';

        }

      } catch (error) {

        console.error('Ошибка установки:', error);

        installStatus.textContent =
          'Не удалось открыть окно установки. ' +
          'Попробуйте установить приложение через меню браузера.';

      }

      deferredPrompt = null;
    });

    // Обычная кнопка установки
    installButton.addEventListener('click', async () => {

      if (isAlreadyInstalled()) {

        alert('Приложение уже установлено');

        installButton.style.display = 'none';

        return;
      }

      if (deferredPrompt) {

        deferredPrompt.prompt();

        const result =
          await deferredPrompt.userChoice;

        if (result.outcome === 'accepted') {

          localStorage.setItem(
            'trainerPwaInstalled',
            'yes'
          );

          installButton.style.display = 'none';

        }

        deferredPrompt = null;

        return;
      }

      alert(
        'Установка сейчас недоступна. ' +
        'Откройте меню браузера и выберите «Установить приложение».'
      );
    });

    // Браузер сообщил, что приложение установлено
    window.addEventListener('appinstalled', () => {

      localStorage.setItem(
        'trainerPwaInstalled',
        'yes'
      );

      deferredPrompt = null;

      installButton.style.display = 'none';

      if (installMode) {

        installPageButton.style.display = 'none';

        installStatus.textContent =
          'Приложение уже установлено.';

      }
    });

    // Если приложение уже установлено
    if (isAlreadyInstalled()) {

      installButton.style.display = 'none';

      if (installMode) {

        installPageButton.style.display = 'none';

        installStatus.textContent =
          'Приложение уже установлено.';

      }
    }

    // Service Worker
    if ('serviceWorker' in navigator) {

      window.addEventListener('load', () => {

        navigator.serviceWorker
          .register('./sw.js')
          .catch(error => {
            console.error(
              'Service Worker:',
              error
            );
          });

      });

    }
  </script>

</body>
</html>
