<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <meta name="theme-color" content="#800000">

  <title>Установка приложения</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 32px 24px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }

    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 22px;
      object-fit: cover;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      margin: 0 0 24px;
      font-size: 16px;
      line-height: 1.5;
      color: #666;
    }

    button {
      width: 100%;
      padding: 15px 20px;
      border: 0;
      border-radius: 12px;

      background: #800000;
      color: white;

      font-size: 17px;
      font-weight: 700;

      cursor: pointer;
    }

    button:hover {
      background: #a00000;
    }

    #status {
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.4;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <img
      class="icon"
      src="icons/icon-192.png"
      alt="Тренажер тестов"
    >

    <h1>Тренажер тестов</h1>

    <p id="description">
      Установите приложение на устройство,
      чтобы быстро открывать тренажер.
    </p>

    <button id="installButton">
      Установить приложение
    </button>

    <div id="status"></div>

  </div>

  <script>
    let deferredPrompt = null;

    const installButton =
      document.getElementById('installButton');

    const status =
      document.getElementById('status');

    function isStandalone() {
      return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );
    }

    function isInstalled() {
      return (
        isStandalone() ||
        localStorage.getItem('trainerPwaInstalled') === 'yes'
      );
    }

    function showAlreadyInstalled() {
      installButton.classList.add('hidden');

      status.textContent =
        'Приложение уже установлено.';
    }

    // Если приложение уже установлено
    if (isInstalled()) {
      showAlreadyInstalled();
    }

    // Браузер сообщает, что приложение можно установить
    window.addEventListener('beforeinstallprompt', (event) => {

      event.preventDefault();

      deferredPrompt = event;

      if (!isInstalled()) {
        installButton.classList.remove('hidden');
        status.textContent = '';
      }
    });

    // Нажатие кнопки установки
    installButton.addEventListener('click', async () => {

      if (isInstalled()) {
        showAlreadyInstalled();
        return;
      }

      if (!deferredPrompt) {
        status.textContent =
          'Установка сейчас недоступна. Откройте меню браузера и выберите «Установить приложение».';
        return;
      }

      deferredPrompt.prompt();

      const result =
        await deferredPrompt.userChoice;

      if (result.outcome === 'accepted') {

        localStorage.setItem(
          'trainerPwaInstalled',
          'yes'
        );

        installButton.classList.add('hidden');

        status.textContent =
          'Приложение устанавливается…';

      } else {

        status.textContent =
          'Установка отменена.';
      }

      deferredPrompt = null;
    });

    // Установка действительно завершилась
    window.addEventListener('appinstalled', () => {

      localStorage.setItem(
        'trainerPwaInstalled',
        'yes'
      );

      installButton.classList.add('hidden');

      status.textContent =
        'Приложение уже установлено.';
    });
  </script>

</body>
</html>
